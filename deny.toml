[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "ISC",
  "Zlib",
  # Enters via libfuzzer-sys (libFuzzer bindings, `(MIT OR Apache-2.0) AND
  # NCSA`) through gpui's image -> ravif -> rav1e chain. NCSA is a permissive
  # OSI-approved license.
  "NCSA",
]
