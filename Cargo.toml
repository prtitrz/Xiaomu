[workspace]
resolver = "2"
members = [
  "crates/xiaomu-core",
  "crates/xiaomu-runtime",
  "crates/xiaomu-gpui",
  "crates/xiaomu-codec-markdown",
  "crates/xiaomu-testkit",
  "examples/editor_harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/prtitrz/Xiaomu"
authors = ["prtitrz"]

[workspace.dependencies]
# GPUI is pinned to an exact crates.io version per planning §17; upgrades
# happen in dedicated pull requests only.
gpui = "=0.2.2"
xiaomu-core = { version = "0.1.0", path = "crates/xiaomu-core" }
xiaomu-runtime = { version = "0.1.0", path = "crates/xiaomu-runtime" }
xiaomu-gpui = { version = "0.1.0", path = "crates/xiaomu-gpui" }
