name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_source_size.py
      - run: python tools/check_dependency_boundaries.py
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      - name: Check dependency advisories
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # CI does not need debuginfo. Full PDBs dominate Windows link time
      # and inflate the rust-cache archive toward GitHub's 10 GB cap.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # GPUI links against X11/XCB and xkbcommon on Linux; the test binaries
      # need the development libraries present at link time.
      - name: Install Linux link dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      # Clippy is not OS-specific for this workspace (no cfg(windows)/cfg(unix)
      # in our crates). Tests still compile and run on every platform, so
      # Windows/macOS catch compile errors and runtime failures.
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  ci-success:
    name: CI Success
    needs:
      - policy
      - check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify CI results
        run: |
          if [ "${{ needs.policy.result }}" != "success" ] || [ "${{ needs.check.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "All CI checks passed"
